# Chạy cả dự án bằng một lệnh:  docker compose up -d --build   rồi mở http://localhost:3000
# Lần đầu: tải image, build, tải model Qwen (~2 GB) nên mất 10-20 phút. Các lần sau chỉ build lại phần code đã sửa.
# Biến môi trường (khóa bí mật, Gmail...) đặt trong file .env cạnh file này, xem .env.example.

services:
  db:
    image: postgres:16  # giữ đúng image cũ: volume pgdata đã tạo bằng nó dùng tiếp được
    environment:
      POSTGRES_USER: feedback
      POSTGRES_PASSWORD: feedback
      POSTGRES_DB: feedback
    # mở cổng để chạy backend trực tiếp trên máy mà dùng DB này (docker compose up -d db).
    # Chỉ trên 127.0.0.1: mật khẩu feedback/feedback ai cũng biết, mở cho cả mạng LAN (Wi-Fi trường khi demo)
    # là máy khác vào thẳng được DB. Đang bật PostgreSQL portable (start.bat) thì cổng 5432 đã bận: tắt một trong hai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data  # dữ liệu giữ lại qua các lần build / tắt bật
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedback"]
      interval: 3s
      retries: 20

  ollama:
    image: ollama/ollama:0.5.7
    volumes:
      - ollama:/root/.ollama

  # chạy một lần: tải model Qwen vào volume của ollama (lần sau đã có thì xong ngay)
  ollama-pull:
    image: ollama/ollama:0.5.7
    environment:
      OLLAMA_HOST: ollama:11434
    command: ["pull", "${LLM_MODEL:-qwen2.5:3b}"]
    depends_on:
      - ollama
    restart: on-failure

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://feedback:feedback@db:5432/feedback
      # model PhoBERT không nằm trong git (518 MB): đặt vào ml/models/absa. Không có thì backend tự dùng bộ từ điển
      NLP_MODEL_DIR: /models/absa
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      # bắt buộc đặt trong .env: khóa mặc định nằm công khai trên GitHub thì ai cũng dò ngược được IP khách đã băm
      SECRET_KEY: ${SECRET_KEY:?Chưa đặt SECRET_KEY trong file .env (xem .env.example)}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # IP khách lấy từ X-Forwarded-For do frontend gửi (chặn spam QR theo từng khách). An toàn vì backend
      # không mở cổng ra ngoài: chỉ frontend trong mạng Docker gọi được
      TRUST_PROXY: "1"
    volumes:
      - ./ml/models:/models:ro
      - ./backend/outbox:/app/outbox  # email khi chưa cấu hình Gmail: mở file .eml ở backend/outbox để xem
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      # chạy http (localhost hoặc IP trong mạng LAN khi demo): cookie Secure bị trình duyệt bỏ, không đăng nhập được.
      # Có HTTPS thì đặt COOKIE_SECURE=true trong .env
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  ollama:
